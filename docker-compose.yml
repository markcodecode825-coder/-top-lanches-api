services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: top_lanches
    ports:
      - "5432:5432"
    volumes:
      - top_lanches_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d top_lanches"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/top_lanches
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  top_lanches_postgres_data:
